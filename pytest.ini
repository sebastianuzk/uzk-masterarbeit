[pytest]
# Test Discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test Directories
testpaths = tests

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    llm: marks tests as LLM quality tests (requires Ollama)
    asyncio: marks tests as asynchronous tests
    email: marks tests that require email configuration
    klips: marks tests that require KLIPS credentials
    rag: marks tests that require RAG database
    network: marks tests that require network access
    eval: marks tests as evaluation scenario tests for tool usage

# Output
console_output_style = progress
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -ra
    --maxfail=5

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout - 60 Sekunden pro Test (für LLM-Tests)
timeout = 60
timeout_method = thread

# Asyncio
asyncio_mode = auto
